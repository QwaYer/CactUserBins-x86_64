# Meson cross file for CactOS userspace (x86_64, freestanding).
#
#   meson setup build-meson --cross-file cross/x86_64-cact-clang.ini
#
# The tools link against CactLibc/ld.so rather than a host libc, so clang only
# needs 64-bit mode; system = 'none' keeps Meson from assuming a hosted C
# library.  clang targets x86_64-pc-linux-gnu on this host, so `-m64` is all
# that is left to ask for.

[binaries]
c = 'clang'
ar = 'ar'
strip = 'strip'
objcopy = 'objcopy'

[built-in options]
c_args = ['-m64']

[host_machine]
system = 'none'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
